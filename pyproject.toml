[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rad"
version = "0.1.0"
description = "Poisoning-resistant continual anomaly detection for a single device on a consumer router"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "dpkt>=1.9.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Installed in Phase 1c (detectors + baselines).
models = ["river>=0.21", "scikit-learn>=1.4", "torch>=2.2", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
