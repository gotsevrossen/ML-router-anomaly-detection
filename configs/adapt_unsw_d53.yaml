# Update rules on real attack days with the D53-D55 models and the streaming strict dual alarm (D56).
# Declared 2026-10-19 before running. As adapt_unsw_cal3_d47 / ablation_unsw (D42-D47), except:
#   detectors  ECOD and RobustZ with directional scoring (D53); RobustZ tail_quantile 0.995 (D55)
#   features   v42 (per-protocol packet counts, D53), extracted by the pipeline itself
#   alarm      strict_dual k=8, margin 0.02 (the regress_i9/i10 alarm, now in the router pipeline)
# Run (per device, in parallel): python -m rad.eval.adapt --config configs/adapt_unsw_d53.yaml --only <device>
experiment: adapt_unsw_d53
seed: 0
out_dir: results
data_config: configs/unsw.yaml

features:
  exclude: [is_weekend]

detectors:
  ecod_router: {type: ecod, top_k: 3, tail_z: 3.0, min_scale: 0.05, stats: sketch, directional: true}
  robust_z_router: {type: robust_z, stats: sketch, precision: int16, min_scale: 0.05, monotone_scales: true, directional: true, tail_quantile: 0.995}

update_rules: [frozen, naive, gated, full]

calibration:
  alarms_per_day: 1
  admit_quantile: 0.9
  above_bootstrap: true

pipeline:
  quarantine: {t_delay_s: 86400, purge_k: 10, taint_on_alert: false}
  budget: {b_daily: 3.0, b_total: 6.0, calibrate_factor: 2.0, measure: capped_mean, cap: 3.0}
  anchor: {update_every_s: null}
  disambiguation: {tau_div: 3.0}
  alert_k: 2
  alert_n: 3
  top_k: 3
  alarm: {mode: strict_dual, k: 8, margin: 0.02}
