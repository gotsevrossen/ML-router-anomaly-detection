# RobustZ (D27) vs the previous best MAD variant on N-BaIoT, with the tie-safe threshold (D28).
# Development device:  python -m rad.eval.nbaiot --config configs/nbaiot_robust_z.yaml
# Held-out devices:    ... --device Ecobee_Thermostat   (etc., all 8 others)
# Options were chosen on the development sets only (Danmini, Mirai); values fixed before any held-out run.

experiment: nbaiot_robust_z
seed: 0
out_dir: results
device_dir: C:/Users/gotse/OneDrive/Desktop/AI reserch data/detection+of+iot+botnet+attacks+n+baiot/Danmini_Doorbell

split:
  bootstrap_frac: 0.5
  validation_frac: 0.2
attack_rows_per_file: 2000

threshold:
  target_fpr: 0.001

metrics:
  fpr: [0.001, 0.0001]
  pauc_max_fpr: [0.01, 0.1]

detectors:
  mad_tail_slog: {type: mad, window: 50000, tail_quantile: 0.999, tail_z: 3.0, preprocess: {steps: [slog]}}
  robust_z: {stats: exact, precision: float32, window: 50000}
  robust_z_router: {type: robust_z, stats: sketch, precision: int16}
