# RQ2/RQ4 benign drift experiment (D46). Fixed before the first run (2026-10-11 ~16:30).
# Run: python -m rad.eval.drift --config configs/drift_unsw.yaml [--events firmware ...]
experiment: drift_unsw_d49
seed: 0
out_dir: results
work_dir: data/interim/drift_unsw
data_config: configs/unsw.yaml
devices: [samsung_camera, tplink_plug, wemo_switch]
day_offset_h: 0   # UNSW daily pcaps are UTC days
benign_days: [benign/18-05-28, benign/18-05-29, benign/18-05-30, benign/18-05-31]

events:
  firmware: {kind: firmware_update, n_days: 7, event_day: 2, event_hour: 3, download_mb: 20.0}
  reinstall: {kind: app_reinstall, n_days: 7, event_day: 2, event_hour: 3}
  usage: {kind: usage_increase, n_days: 7, event_day: 2, event_hour: 3}

update_rules: [frozen, naive, gated, full]

features:
  exclude: [is_weekend]
detector: {type: robust_z, stats: sketch, precision: int16, min_scale: 0.05, monotone_scales: true}

calibration:
  alarms_per_day: 1
  admit_quantile: 0.9
  above_bootstrap: true   # D47; RobustZ monotone_scales now also keeps the bootstrap interval normal (D49), declared before running

pipeline:   # as adapt_unsw_cal3 / poison_unsw (D42-D44)
  quarantine: {t_delay_s: 86400, purge_k: 10, taint_on_alert: false}
  budget: {b_daily: 3.0, b_total: 6.0, calibrate_factor: 2.0, measure: capped_mean, cap: 3.0}
  anchor: {update_every_s: null}
  disambiguation: {tau_div: 3.0}
  alert_k: 2
  alert_n: 3
  top_k: 3
