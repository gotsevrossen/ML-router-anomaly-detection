# D60: alarm on min(learned, frozen bootstrap model), ECOD refit_every 120 (D57), RobustZ tail_quantile 1.0.
# UNSW June (development set). Declared 2026-10-20 before running. Otherwise as adapt_unsw_d53.
experiment: adapt_unsw_d60
seed: 0
out_dir: results
data_config: configs/unsw.yaml

features:
  exclude: [is_weekend]

detectors:
  ecod_router: {type: ecod, top_k: 3, tail_z: 3.0, min_scale: 0.05, stats: sketch, directional: true, refit_every: 120}
  robust_z_router: {type: robust_z, stats: sketch, precision: int16, min_scale: 0.05, monotone_scales: true, directional: true}   # tail_quantile 1.0 with learning (D55 amendment)

update_rules: [frozen, gated, full]

calibration:
  alarms_per_day: 1
  admit_quantile: 0.9
  above_bootstrap: true

pipeline:
  quarantine: {t_delay_s: 86400, purge_k: 10, taint_on_alert: false}
  budget: {b_daily: 3.0, b_total: 6.0, calibrate_factor: 2.0, measure: capped_mean, cap: 3.0}
  anchor: {update_every_s: null}
  disambiguation: {tau_div: 3.0}
  alert_k: 2
  alert_n: 3
  top_k: 3
  alarm: {mode: strict_dual, k: 8, margin: 0.02, score: min_reference}   # D60
