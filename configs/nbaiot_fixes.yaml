# Branch fix/iforest-mad-extrapolation: original vs fixed IForest and MAD on N-BaIoT (D22, D23).
# Development device (already inspected):   python -m rad.eval.nbaiot --config configs/nbaiot_fixes.yaml
# Held-out devices (never inspected):        ... --device Ecobee_Thermostat   (etc.)
# All new parameter values were fixed before any run with them (no tuning on attack data).

experiment: nbaiot_fixes
seed: 0
out_dir: results
device_dir: C:/Users/gotse/OneDrive/Desktop/AI reserch data/detection+of+iot+botnet+attacks+n+baiot/Danmini_Doorbell

split:
  bootstrap_frac: 0.5
  validation_frac: 0.2
attack_rows_per_file: 2000

threshold:
  target_fpr: 0.001

metrics:
  fpr: [0.001, 0.0001]
  pauc_max_fpr: [0.01, 0.1]

detectors:
  iforest: {n_estimators: 100, max_samples: 256, window: 50000, seed: 0}
  iforest_headroom: {type: iforest, n_estimators: 100, max_samples: 256, window: 50000, margin: 0.25, extra_depth: 4, seed: 0}
  iforest_extended: {type: iforest, n_estimators: 100, max_samples: 256, window: 50000, margin: 0.25, extra_depth: 4, hyperplane: true, tail_quantile: 0.999, tail_z: 3.0, seed: 0}
  mad: {window: 50000}
  mad_tail: {type: mad, window: 50000, tail_quantile: 0.999, tail_z: 3.0}
  hst: {n_trees: 25, height: 10, window_size: 250, seed: 0}
  autoencoder: {hidden: 8, lr: 0.01, bootstrap_steps: 3000, batch_size: 64, buffer: 50000, seed: 0}
